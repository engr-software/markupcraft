[package]
name = "markupcraft-engine"
description = "An open document session: markup edits, undo/redo, selection, page operations"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
markupcraft-geom = { workspace = true }
markupcraft-measure = { workspace = true }
markupcraft-model = { workspace = true }
markupcraft-revu = { workspace = true }
markupcraft-render = { workspace = true }
pdfcraft-annot = { workspace = true }
pdfcraft-compare = { workspace = true }
pdfcraft-edit = { workspace = true }
pdfcraft-fonts = { workspace = true }
pdfcraft-forms = { workspace = true }
pdfcraft-ocr = { workspace = true }
pdfcraft-redact = { workspace = true }
pdfcraft-sign = { workspace = true }
thiserror = { workspace = true }
pdfcraft-organize = { workspace = true }
pdfcraft-print = { workspace = true }
pdfcraft-xfdf = { workspace = true }
pdfcraft-optimize = { workspace = true }
pdfcraft-render = { workspace = true }
image = { workspace = true, features = ["jpeg", "tiff", "bmp"] }
serde = { workspace = true }
serde_json = { workspace = true }
pdfcraft-content = { workspace = true }
pdfcraft-export = { workspace = true }
pdfcraft-preflight = { workspace = true }
pdfcraft-js = { workspace = true }
pdfcraft-xfa = { workspace = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
roxmltree = "0.20"
tiff = "0.11"
weezl = "0.1"
