[package]
name = "markupcraft-ui-egui"
description = "The Revu-style egui interface of MarkupCraft"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
web-time = { workspace = true }
markupcraft-geom = { workspace = true }
markupcraft-measure = { workspace = true }
markupcraft-model = { workspace = true }
markupcraft-revu = { workspace = true }
markupcraft-render = { workspace = true }
markupcraft-engine = { workspace = true }
markupcraft-automation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
egui_dock = { workspace = true, features = ["serde"] }
eframe = { workspace = true, features = ["default_fonts", "accesskit"] }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# wgpu on the desktop; the browser build (apps/markupcraft-web) picks its own renderer.
eframe = { workspace = true, features = ["wgpu"] }
rfd = { workspace = true }
nokhwa = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's file picker; `file-handle-inner` as in PdfCraft's web build.
rfd = { workspace = true, features = ["file-handle-inner"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Storage"] }

[features]
# The system camera for Markup > Camera and Create from Scanner or Camera.
camera = ["dep:nokhwa"]

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
image = { workspace = true }
tiff = "0.11"
pdfcraft-xfa = { workspace = true }
