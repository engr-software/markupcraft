[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
default-members = ["crates/*", "apps/markupcraft", "apps/markupcraft-cli", "xtask"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/engr-software/markupcraft"

[workspace.dependencies]
# internal
markupcraft-geom = { path = "crates/geom" }
markupcraft-measure = { path = "crates/measure" }
markupcraft-model = { path = "crates/model" }
markupcraft-revu = { path = "crates/revu" }
markupcraft-render = { path = "crates/render" }
markupcraft-engine = { path = "crates/engine" }
markupcraft-automation = { path = "crates/automation" }
markupcraft-ui-egui = { path = "crates/ui-egui" }
markupcraft-acceptance = { path = "crates/acceptance" }

# PDF object layer and page renderer from PdfCraft (MIT OR Apache-2.0), pinned.
pdfcraft-cos = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
pdfcraft-content = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
pdfcraft-organize = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
pdfcraft-edit = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
pdfcraft-print = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
pdfcraft-xfdf = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
pdfcraft-optimize = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
# Compare, OCR, redaction, forms, signatures and content edits from PdfCraft, same pin.
pdfcraft-annot = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
pdfcraft-compare = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
pdfcraft-fonts = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
pdfcraft-forms = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
pdfcraft-ocr = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
pdfcraft-redact = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
pdfcraft-sign = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
# Export to Word/HTML/RTF and PDF/A preflight from PdfCraft, same pin.
pdfcraft-export = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
pdfcraft-preflight = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
# Document JavaScript and the JavaScript console (PdfCraft's sandboxed boa interpreter), same pin.
pdfcraft-js = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
pdfcraft-xfa = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# std::time that also works in the browser (re-exports std::time on native; MIT OR Apache-2.0).
web-time = "1.1"

# ui
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false }
egui_kittest = "0.36"
rfd = "0.17"
egui_dock = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp"] }
# The system camera (Markup > Camera), behind the app's `camera` feature (Apache-2.0).
nokhwa = { version = "0.10.11", default-features = false, features = ["input-native", "decoding"] }
winresource = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# PdfCraft carries small safety patches to these crates (its vendor/README.md); use the same.
[patch.crates-io]
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "a6bc63a497954af87c1cd5a2a1e72e928a11c039" }
