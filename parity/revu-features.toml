# Revu feature parity: one row per row of docs/revu_features/01..05.
#
# status   = the Rust workspace today: missing | partial | have (built, tested from documentation)
#            | proven (matches a recording of real Revu, docs/EQUIVALENCE.md)
# cpp      = what the C++ reference build had (have | partial | missing), so later waves know what to port
# evidence = test function names or `cli: <subcommand>`; `cargo xtask parity --check` verifies them
# excluded = out of scope (Studio sessions/projects server, Bluebeam Cloud, DMS, Office/CAD plugins, 3D PDF)
# ref      = the inventory row (ID, or Category: Command for shortcuts); source = file:line

