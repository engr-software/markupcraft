<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>MarkupCraft</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <link data-trunk rel="icon" href="../../assets/logo-256.png" />
    <link data-trunk rel="copy-file" href="../../assets/logo.svg" />
    <style>
      :root { --chrome: #f3f3f5; --text: #55575e; --accent: #1b63e0; }
      @media (prefers-color-scheme: dark) { :root { --chrome: #2b2d31; --text: #b4b6bc; --accent: #5b8ff0; } }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--chrome); }
      canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
      #loading {
        position: absolute; inset: 0; display: flex; flex-direction: column; gap: 16px;
        align-items: center; justify-content: center; text-align: center; padding: 16px;
        font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
      }
      #loading img { width: 96px; height: 96px; }
      #loading .bar { width: 160px; height: 3px; border-radius: 2px; background: color-mix(in srgb, var(--accent) 20%, transparent); overflow: hidden; }
      #loading .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    </style>
  </head>
  <body>
    <canvas id="markupcraft"></canvas>
    <div id="loading">
      <img src="logo.svg" alt="" />
      <div>Loading MarkupCraft&hellip;</div>
      <div class="bar"></div>
      <noscript>MarkupCraft needs JavaScript and WebAssembly.</noscript>
    </div>
  </body>
</html>
